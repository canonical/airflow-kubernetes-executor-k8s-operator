[tox]
no_package = True
skip_missing_interpreters = True
min_version = 4.0.0
env_list = format, lint

[vars]
src_path = {tox_root}/src
all_path = {[vars]src_path}
uv_flags = --isolated

[testenv]
allowlist_externals = uv
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1

[testenv:format]
description = Apply coding style standards
commands =
    uv tool run {[vars]uv_flags} ruff format {[vars]all_path}
    uv tool run {[vars]uv_flags} ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code against standards and static checks
commands =
    uv sync --active --group lint
    uv tool run {[vars]uv_flags} codespell {tox_root}
    uv tool run {[vars]uv_flags} ruff check {[vars]all_path}
    uv tool run {[vars]uv_flags} ruff format --check --diff {[vars]all_path}
