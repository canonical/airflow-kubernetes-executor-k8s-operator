[project]
name = "mock-coordinator-charm"
version = "0.0.1"
requires-python = ">=3.10"

dependencies = [
    "ops>=3,<4",
    "pydantic>=2.0",
    "Jinja2>=3.1.6",
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
]

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.codespell]
skip = "build,lib,venv,.tox,.git,.mypy_cache,.ruff_cache,.coverage,icon.svg"

[tool.pyright]
include = ["src", "tests"]
