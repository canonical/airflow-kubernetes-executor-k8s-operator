[project]
name = "airflow-kubernetes-executor-k8s-operator"
version = "0.0"
requires-python = ">=3.10"

# Dependencies of the charm code.
# Include dependencies of any charmlibs used (copy the PYDEPS from each lib).
dependencies = [
    "ops>=3,<4",
    "pydantic>=2.0",
    "Jinja2>=3.1.6",
    "lightkube>=0.15",
    "lightkube-models>=1.30",
    "charmed-kubeflow-chisme>=0.4.21",
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
]
format = [
    "ruff",
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
integration = [
    "jubilant",
    "pytest",
    "PyYAML",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--tb=native --verbose --capture=no --log-cli-level=INFO"

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,**/data_platform_libs"

[tool.pyright]
include = ["src", "tests"]
